name: Java Windows 11 CI

on:
  push:
    paths:
      - "java-win11/**"
      - "examples/**"
      - "help/**"
      - "assets/branding/**"
      - ".github/workflows/java-win11-ci.yml"
  pull_request:
    paths:
      - "java-win11/**"
      - "examples/**"
      - "help/**"
      - "assets/branding/**"
      - ".github/workflows/java-win11-ci.yml"
  workflow_dispatch:

jobs:
  verify-java-edition:
    name: Verify Java 21 / Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Eclipse Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify all
        shell: cmd
        run: java-win11\scripts\verify-all.bat

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconcilelab-java-verification
          if-no-files-found: ignore
          path: |
            java-win11/.local/verify-all.txt
            java-win11/target/site/jacoco/**
            java-win11/target/site/apidocs/**
